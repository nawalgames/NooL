<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>لعبة المجازفة — NoL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg-gradient:linear-gradient(135deg,#0c102b 0%,#1a1438 50%,#080a17 100%);
  --panel:rgba(19,23,44,.95);
  --line:#303b63;
  --gold:#f3ce6b;
  --text:#f1f0ec;
  --text-dim:#9a9db3;

  --red:#d32f2f;
  --green:#2e7d32;
  --blue:#1565c0;
  --yellow:#f9a825;
  --purple:#6a1b9a;
}

*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  height:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  background:var(--bg-gradient);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Tajawal',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8px;
}

.wrap{
  max-width:480px;
  width:100%;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* =========================
   SUBSCRIPTION SCREEN
========================= */
.sub-screen{
  position:fixed;
  inset:0;
  background:rgba(8,10,23,.98);
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  overflow-y:auto;
}

.sub-box{
  background:var(--panel);
  border:2px solid var(--gold);
  border-radius:20px;
  padding:25px;
  width:100%;
  max-width:380px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.7);
}

.sub-box h2{
  color:var(--gold);
  margin-top:0;
  margin-bottom:10px;
  font-weight:900;
}

.sub-box p{
  color:var(--text-dim);
  font-size:13px;
  margin-bottom:20px;
}

.sub-input{
  width:100%;
  padding:12px;
  border-radius:10px;
  background:#0c102b;
  color:#fff;
  border:1px solid var(--line);
  font-family:inherit;
  font-size:16px;
  text-align:center;
  letter-spacing:2px;
  margin-bottom:15px;
}

.sub-btn{
  background:var(--gold);
  border:none;
  padding:12px;
  border-radius:10px;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  color:#111;
  width:100%;
  box-shadow:0 4px 15px rgba(243,206,107,.3);
}

.support-contact{
  margin-top:15px;
  font-size:12px;
  color:var(--text-dim);
  border-top:1px dashed var(--line);
  padding-top:12px;
}

.support-contact a{
  color:var(--gold);
  text-decoration:none;
  font-weight:700;
  cursor:pointer;
}

.back-home-btn{
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:var(--text-dim);
  padding:10px;
  border-radius:10px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  width:100%;
  margin-top:10px;
}

.back-home-btn:hover{
  color:#fff;
  border-color:var(--gold);
}

/* =========================
   SETUP
========================= */

.setup-screen{
  position:fixed;
  inset:0;
  background:rgba(10,13,28,.96);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  overflow-y:auto;
}

.setup-box{
  background:var(--panel);
  border:2px solid var(--gold);
  border-radius:20px;
  padding:20px;
  width:100%;
  max-width:380px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  max-height:92vh;
  overflow-y:auto;
}

.setup-box h2{
  color:var(--gold);
  margin-top:0;
  margin-bottom:15px;
  font-weight:900;
}

.setup-group{
  margin-bottom:12px;
  text-align:right;
}

.setup-group label{
  display:block;
  font-size:13px;
  color:var(--text-dim);
  margin-bottom:4px;
  font-weight:700;
}

.setup-group select,
.setup-group input{
  width:100%;
  padding:9px;
  border-radius:10px;
  background:#0c102b;
  color:#fff;
  border:1px solid var(--line);
  font-family:inherit;
  font-size:14px;
}

.teams-names-inputs{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:10px;
}

.setup-btn{
  background:var(--gold);
  border:none;
  padding:12px;
  border-radius:10px;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
  color:#111;
  width:100%;
  margin-top:5px;
  box-shadow:0 4px 15px rgba(243,206,107,.3);
}

.share-link-box{
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed var(--line);
  text-align:center;
}

.room-code{
  color:var(--gold);
  font-weight:900;
  font-size:20px;
  margin:5px 0 10px;
  letter-spacing:2px;
  direction:ltr;
}

.share-btn{
  background:rgba(53,162,159,.2);
  border:1px solid #35a29f;
  color:#4ee1dc;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  width:100%;
  margin-top:5px;
}

.end-session-btn{
  background:rgba(211,47,47,.15);
  border:1px solid #d32f2f;
  color:#ff7272;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  width:100%;
  margin-top:7px;
}

/* =========================
   HEADER
========================= */

.header-brand{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--panel);
  padding:8px 14px;
  border-radius:12px;
  border:1px solid var(--line);
  box-shadow:0 4px 15px rgba(0,0,0,.5);
}

.brand-title-group{
  display:flex;
  align-items:center;
  gap:8px;
}

.brand-title{
  font-size:20px;
  font-weight:900;
  background:linear-gradient(to bottom,#fff,#b0c4de);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.nol-logo{
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
  background:linear-gradient(135deg,#f3ce6b,#ff9f43);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  border:1px solid rgba(243,206,107,.3);
  padding:2px 5px;
  border-radius:5px;
  background-color:rgba(243,206,107,.05);
}

.top-actions{
  display:flex;
  gap:6px;
}

.top-btn{
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:var(--text-dim);
  padding:5px 8px;
  border-radius:6px;
  font-family:inherit;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

.top-btn:hover{
  color:#fff;
  border-color:var(--gold);
}

/* =========================
   ROOM INFO
========================= */

.room-info{
  background:rgba(243,206,107,.08);
  border:1px solid rgba(243,206,107,.3);
  border-radius:10px;
  padding:7px;
  text-align:center;
  font-size:11px;
}

.room-info strong{
  color:var(--gold);
}

.room-id{
  direction:ltr;
  display:inline-block;
  color:#fff;
  font-weight:900;
  letter-spacing:2px;
}

/* =========================
   TEAMS
========================= */

.teams-container{
  display:flex;
  gap:6px;
}

.team-card{
  background:var(--panel);
  border:1.5px solid var(--line);
  border-radius:8px;
  padding:5px;
  text-align:center;
  flex:1;
  cursor:pointer;
  transition:all .2s;
}

.team-card.active{
  border-color:#4cd137;
  background:rgba(76,209,55,.12);
  box-shadow:0 0 10px rgba(76,209,55,.3);
}

.team-card .t-name{
  font-size:10px;
  color:var(--text-dim);
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.team-card .t-score{
  font-size:15px;
  font-weight:900;
  color:#fff;
}

/* =========================
   TURN
========================= */

.turn-banner{
  background:rgba(19,23,44,.8);
  border:1px dashed var(--line);
  padding:5px;
  border-radius:6px;
  text-align:center;
  font-size:11px;
  color:var(--text-dim);
}

.turn-banner strong{
  color:var(--gold);
}

/* =========================
   BOARD
========================= */

.game-frame{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
  background:rgba(13,15,26,.85);
  padding:8px;
  border-radius:14px;
  border:2px solid var(--line);
  width:100%;
}

.card-cell{
  background:#151a30;
  border:2px solid #3d4a7a;
  border-radius:6px;
  aspect-ratio:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:900;
  color:#e2e8f0;
  cursor:pointer;
  position:relative;
  box-shadow:inset 0 0 4px rgba(0,0,0,.6);
  transition:transform .1s;
}

.card-cell::after{
  content:'';
  position:absolute;
  inset:2px;
  border:1px dotted rgba(243,206,107,.4);
  border-radius:4px;
  pointer-events:none;
}

.card-cell:hover{
  transform:scale(1.04);
  border-color:var(--gold);
}

.spectator-mode .card-cell{
  cursor:default!important;
}

.spectator-mode .card-cell:hover{
  transform:none!important;
  border-color:#3d4a7a!important;
}

.card-cell.hidden-slot{
  background:transparent!important;
  border:2px dashed rgba(255,255,255,.02)!important;
  box-shadow:none!important;
  pointer-events:none!important;
  color:transparent!important;
}

.card-cell.hidden-slot::after{
  display:none;
}

.card-inner-val{
  font-size:16px;
  font-weight:900;
}

.card-inner-sub{
  font-size:9px;
  font-weight:700;
  margin-top:-2px;
  opacity:.9;
}

.bg-red{
  background:var(--red)!important;
  border-color:#ff6b6b!important;
  color:#fff!important;
}

.bg-green{
  background:var(--green)!important;
  border-color:#6ab04c!important;
  color:#fff!important;
}

.bg-blue{
  background:var(--blue)!important;
  border-color:#48dbfb!important;
  color:#fff!important;
}

.bg-yellow{
  background:var(--yellow)!important;
  border-color:#feca57!important;
  color:#111!important;
}

.bg-purple{
  background:var(--purple)!important;
  border-color:#c56cf0!important;
  color:#fff!important;
}

.bg-bomb{
  background:#b71c1c!important;
  border-color:#ff5252!important;
  color:#fff!important;
  font-size:20px;
}

.bg-double{
  background:#ff8f00!important;
  border-color:#ffe082!important;
  color:#111!important;
  font-size:15px;
}

/* =========================
   CONTROLS
========================= */

.footer-control{
  display:flex;
  gap:6px;
}

.action-btn{
  flex:1;
  padding:10px;
  border-radius:10px;
  font-family:inherit;
  font-weight:700;
  font-size:12px;
  border:none;
  cursor:pointer;
  text-align:center;
}

.btn-save{
  background:#2e7d32;
  color:#fff;
  box-shadow:0 4px 12px rgba(46,125,50,.4);
}

.btn-fail{
  background:#c62828;
  color:#fff;
  box-shadow:0 4px 12px rgba(198,40,40,.4);
}

.spectator-banner{
  background:rgba(53,162,159,.15);
  border:1px solid #35a29f;
  color:#4ee1dc;
  text-align:center;
  padding:8px;
  border-radius:10px;
  font-weight:700;
  font-size:12px;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  align-items:center;
  justify-content:center;
  z-index:2000;
  padding:20px;
}

.modal-overlay.active{
  display:flex;
}

.modal-box{
  background:var(--panel);
  border:2px solid var(--gold);
  border-radius:16px;
  padding:20px;
  width:100%;
  max-width:340px;
  text-align:center;
}

.modal-box h3{
  color:var(--gold);
  margin-top:0;
}

.modal-box button{
  background:var(--gold);
  border:none;
  padding:10px 20px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
  color:#111;
  width:100%;
}

/* =========================
   LOADING
========================= */

.loading{
  position:fixed;
  inset:0;
  z-index:1500;
  background:#080a17;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.loading-box{
  color:#fff;
}

.loading-box h2{
  color:var(--gold);
}

.hidden{
  display:none!important;
}
</style>
</head>

<script>

let db = null;
let firebaseReady = false;
let roomId = null;
let teams = [];
let activeTeamIndex = 0;
let tempScore = 0;
let currentRoundPicks = [];
let totalCards = 50;
let boardCards = [];
let configBombs = 3;
let configDoubles = 3;
let isSpectator = false;
let gameFinished = false;
let unsubscribeGame = null;

const colorList = [
  { name:'red', label:'أحمر', cls:'bg-red' },
  { name:'green', label:'أخضر', cls:'bg-green' },
  { name:'blue', label:'أزرق', cls:'bg-blue' },
  { name:'yellow', label:'أصفر', cls:'bg-yellow' },
  { name:'purple', label:'بنفسجي', cls:'bg-purple' }
];

window.addEventListener('firebase-ready', () => {
  db = window.NoLFirebase.db;
  firebaseReady = true;
  initializeApplication();
});


async function initializeApplication(){
  const loading = document.getElementById('loadingScreen');
  const loadingText = document.getElementById('loadingText');

  try{
    updateTeamInputsGenerator();
    const urlParams = new URLSearchParams(window.location.search);
    const urlRoom = urlParams.get('room');

    if(urlRoom){
      roomId = urlRoom.toUpperCase();
      isSpectator = true;
      loadingText.textContent = 'جاري فتح جلسة المشاهدة...';
      await openSpectatorRoom(roomId);
    } else {
      isSpectator = false;
      loading.style.display = 'none';

      // التحقق من وجود اشتراك مسبق مخزن محلياً
      const savedKey = localStorage.getItem('nol_license_key');
      if(savedKey){
        loading.style.display = 'flex';
        loadingText.textContent = 'جاري التحقق من صلاحية الاشتراك...';
        const isValid = await validateKeyOnServer(savedKey);
        loading.style.display = 'none';
        if(isValid){
          setupHostUI();
          document.getElementById('setupScreen').style.display = 'flex';
        } else {
          localStorage.removeItem('nol_license_key');
          document.getElementById('subScreen').style.display = 'flex';
        }
      } else {
        document.getElementById('subScreen').style.display = 'flex';
      }
    }
  } catch(error){
    console.error(error);
    loadingText.textContent = 'حدث خطأ في الاتصال بـ Firebase.';
  }
}

// دالة التحقق وتحديث الأكواد لتتوافق 100% مع لوحة التحكم (تفعيل وتتبع)
async function verifyLicenseKey(){
  const inputKey = document.getElementById('licenseKeyInput').value.trim();
  if(!inputKey){
    showAlert('تنبيه', 'الرجاء إدخال كود الاشتراك.');
    return;
  }

  const loading = document.getElementById('loadingScreen');
  loading.style.display = 'flex';
  document.getElementById('loadingText').textContent = 'جاري التحقق من الكود...';

  const isValid = await validateKeyOnServer(inputKey);
  loading.style.display = 'none';

  if(isValid){
    localStorage.setItem('nol_license_key', inputKey);
    document.getElementById('subScreen').style.display = 'none';
    setupHostUI();
    document.getElementById('setupScreen').style.display = 'flex';
  } else {
    showAlert('كود غير صالح', 'عذراً، هذا الكود غير صحيح، أو ملغى، أو انتهت صلاحيته الزمنية.');
  }
}

async function validateKeyOnServer(key){
  try{
    const keyRef = window.NoLFirebase.ref(db, `codes/${key}`);
    const snapshot = await window.NoLFirebase.get(keyRef);

    if(!snapshot.exists()) return false;

    const data = snapshot.val();
    const now = Date.now();

    // إذا كان الكود ملغى مسبقاً
    if(data.status === 'revoked') return false;

    // إذا كان الكود جديداً ولم يُفعل من قبل
    if(data.status === 'new' || !data.status){
      const durationDays = Number(data.days) || 30;
      const expiresAt = now + (durationDays * 24 * 60 * 60 * 1000);
      
      await window.NoLFirebase.update(keyRef, {
        status: 'active',
        activatedAt: now,
        expiresAt: expiresAt
      });
      return true;
    }

    // إذا كان نشطاً لكن انتهى وقت صلاحيته
    if(data.status === 'active' && data.expiresAt && data.expiresAt < now){
      return false;
    }

    // إذا كان نشطاً وصالحاً
    if(data.status === 'active'){
      return true;
    }

    return false;
  } catch(e){
    console.error(e);
    return false;
  }
}

function generateRoomId(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let id = '';
  for(let i=0; i<6; i++){
    id += chars[Math.floor(Math.random() * chars.length)];
  }
  return id;
}

async function createRoom(){
  let newId;
  let exists = true;
  while(exists){
    newId = generateRoomId();
    const snapshot = await window.NoLFirebase.get(window.NoLFirebase.ref(db, `games/${newId}`));
    exists = snapshot.exists();
  }
  roomId = newId;
}

async function openSpectatorRoom(id){
  setupSpectatorUI();
  const roomRef = window.NoLFirebase.ref(db, `games/${id}`);
  const snapshot = await window.NoLFirebase.get(roomRef);

  if(!snapshot.exists()){
    showAlert('❌ الجلسة غير موجودة', 'هذا الرابط غير صالح أو أن الجلسة انتهت.');
    document.getElementById('loadingScreen').style.display = 'none';
    return;
  }

  const data = snapshot.val();
  if(data.status === 'finished'){
    showAlert('🔒 انتهت الجلسة', 'هذه اللعبة انتهت ولم يعد رابط المشاهدة صالحاً.');
    document.getElementById('loadingScreen').style.display = 'none';
    return;
  }

  document.getElementById('roomInfo').style.display = 'block';
  document.getElementById('roomCodeDisplay').textContent = id;
  applyGameState(data);

  unsubscribeGame = window.NoLFirebase.onValue(roomRef, snapshot => {
    if(!snapshot.exists()){
      gameFinished = true;
      showAlert('🔒 انتهت الجلسة', 'قام المضيف بإغلاق هذه الجلسة.');
      return;
    }
    const data = snapshot.val();
    if(data.status === 'finished'){
      gameFinished = true;
      showAlert('🔒 انتهت اللعبة', 'تم إغلاق رابط المشاهدة لهذه الجلسة.');
      return;
    }
    applyGameState(data);
  });

  document.getElementById('loadingScreen').style.display = 'none';
}

function applyGameState(data){
  teams = Array.isArray(data.teams) ? data.teams : Object.values(data.teams || {});
  activeTeamIndex = Number(data.activeTeamIndex || 0);
  tempScore = Number(data.tempScore || 0);
  boardCards = Array.isArray(data.boardCards) ? data.boardCards : Object.values(data.boardCards || {});
  currentRoundPicks = Array.isArray(data.currentRoundPicks) ? data.currentRoundPicks : Object.values(data.currentRoundPicks || {});
  renderTeams();
  renderBoard();
  updateTempDisplay();
}

async function startCustomGame(){
  if(isSpectator) return;
  if(!firebaseReady){
    showAlert('انتظر', 'جاري الاتصال بقاعدة البيانات.');
    return;
  }

  const teamsCount = parseInt(document.getElementById('setupTeamsCount').value);
  configBombs = parseInt(document.getElementById('setupBombsCount').value);
  configDoubles = parseInt(document.getElementById('setupDoublesCount').value);

  teams = [];
  for(let i=0; i<teamsCount; i++){
    const input = document.getElementById(`setupTeamName_${i}`);
    const name = input && input.value.trim() !== '' ? input.value.trim() : `الفريق ${i+1}`;
    teams.push({ name: name, score: 0 });
  }

  await createRoom();

  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('roomInfo').style.display = 'block';
  document.getElementById('roomCodeDisplay').textContent = roomId;
  document.getElementById('endGameButton').style.display = 'block';
  document.getElementById('shareArea').style.display = 'block';
  document.getElementById('setupRoomCode').textContent = roomId;

  initGame();
}

function initGame(){
  let indices = Array.from({length: totalCards}, (_,i)=>i);
  indices.sort(()=>Math.random()-.5);

  const bombSet = new Set(indices.slice(0, configBombs));
  const doubleSet = new Set(indices.slice(configBombs, configBombs + configDoubles));
  let remainingIndices = indices.slice(configBombs + configDoubles);

  let normalValuesPool = [];
  for(let i=0; i<5; i++){
    for(let n=1; n<=9; n++){
      normalValuesPool.push(n);
    }
  }
  normalValuesPool.sort(()=>Math.random()-.5);

  let normalColorsPool = [];
  let colorCounter = Math.ceil(remainingIndices.length / colorList.length) + 2;
  for(let c=0; c<colorCounter; c++){
    colorList.forEach(col => normalColorsPool.push(col));
  }
  normalColorsPool.sort(()=>Math.random()-.5);

  let pool = [];
  let normalIdx = 0;

  for(let i=0; i<totalCards; i++){
    let cardId = i+1;
    let type = 'normal';
    let val = 0;
    let colObj = null;
    let cls = '';
    let displayText = cardId.toString();
    let displaySub = '';

    if(bombSet.has(i)){
      type = 'bomb';
      cls = 'bg-bomb';
      displayText = '💣';
      displaySub = 'قنبلة';
    } else if(doubleSet.has(i)){
      type = 'double';
      cls = 'bg-double';
      displayText = '✖2';
      displaySub = 'دبل';
    } else {
      val = normalValuesPool[normalIdx % normalValuesPool.length];
      colObj = normalColorsPool[normalIdx % normalColorsPool.length];
      normalIdx++;
      cls = colObj.cls;
      displayText = val.toString();
      displaySub = colObj.label;
    }

    pool.push({
      id: cardId,
      gridNum: cardId,
      type: type,
      value: val,
      color: colObj ? colObj.name : null,
      cls: cls,
      text: displayText,
      subText: displaySub,
      isOpen: false,
      permanentlyGone: false
    });
  }

  boardCards = pool;
  tempScore = 0;
  currentRoundPicks = [];
  activeTeamIndex = 0;
  saveGameData();
  renderTeams();
  renderBoard();
  updateTempDisplay();
}

async function saveGameData(){
  if(isSpectator || !roomId || !firebaseReady || gameFinished) return;

  const gameState = {
    status: 'active',
    teams: teams,
    activeTeamIndex: activeTeamIndex,
    tempScore: tempScore,
    boardCards: boardCards,
    currentRoundPicks: currentRoundPicks,
    configBombs: configBombs,
    configDoubles: configDoubles,
    updatedAt: Date.now()
  };

  try{
    await window.NoLFirebase.set(window.NoLFirebase.ref(db, `games/${roomId}`), gameState);
  } catch(error){
    console.error('Firebase save error:', error);
  }
}

async function copySpectatorLink(){
  if(!roomId){
    showAlert('تنبيه', 'ابدأ اللعبة أولاً.');
    return;
  }
  await saveGameData();
  const spectatorLink = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
  try{
    await navigator.clipboard.writeText(spectatorLink);
    showAlert('✅ تم نسخ الرابط', 'أرسل الرابط للمشاهدين.\n\nأي شخص يفتحه سيشاهد نفس جلسة اللعبة مباشرة.');
  } catch(error){
    prompt('انسخ رابط المشاهدة:', spectatorLink);
  }
}

async function finishGame(){
  if(isSpectator || !roomId) return;
  const confirmed = confirm('هل تريد إنهاء هذه الجلسة؟\n\nبعد الإنهاء سيصبح رابط المشاهدة غير صالح.');
  if(!confirmed) return;

  gameFinished = true;
  try{
    await window.NoLFirebase.update(window.NoLFirebase.ref(db, `games/${roomId}`), {
      status: 'finished',
      finishedAt: Date.now()
    });

    setTimeout(async ()=>{
      try{
        await window.NoLFirebase.remove(window.NoLFirebase.ref(db, `games/${roomId}`));
      } catch(error){
        console.error('Room delete error:', error);
      }
    }, 3000);

    showAlert('🔒 انتهت الجلسة', 'تم إنهاء اللعبة.\nرابط المشاهدة أصبح غير صالح.');
  } catch(error){
    console.error(error);
    gameFinished = false;
    showAlert('خطأ', 'تعذر إنهاء الجلسة.');
  }
}

function renderTeams(){
  const container = document.getElementById('teamsBar');
  if(!container) return;
  container.innerHTML = '';

  teams.forEach((team, index)=>{
    const card = document.createElement('div');
    card.className = `team-card ${index === activeTeamIndex ? 'active' : ''}`;

    if(!isSpectator){
      card.onclick = ()=>{
        if(currentRoundPicks.length > 0){
          failRound(false);
        }
        activeTeamIndex = index;
        renderTeams();
        saveGameData();
      };
    }

    card.innerHTML = `
      <div class="t-name">${escapeHtml(team.name)}</div>
      <div class="t-score">${team.score}</div>
    `;
    container.appendChild(card);
  });

  const activeName = document.getElementById('activeTeamName');
  if(activeName){
    activeName.textContent = teams[activeTeamIndex]?.name || '';
  }
}

function renderBoard(){
  const board = document.getElementById('gameBoard');
  if(!board) return;
  board.innerHTML = '';

  boardCards.forEach(item=>{
    const cell = document.createElement('div');

    if(item.permanentlyGone){
      cell.className = 'card-cell hidden-slot';
      cell.textContent = '';
    } else if(item.isOpen){
      cell.className = `card-cell used ${item.cls}`;
      cell.innerHTML = `
        <div class="card-inner-val">${item.text}</div>
        <div class="card-inner-sub">${item.subText || ''}</div>
      `;
    } else {
      cell.className = 'card-cell';
      cell.textContent = item.gridNum;
      if(!isSpectator){
        cell.onclick = ()=>revealCard(item);
      }
    }
    board.appendChild(cell);
  });
}

function revealCard(item){
  if(isSpectator || gameFinished || item.isOpen || item.permanentlyGone) return;

  if(item.type === 'bomb'){
    item.isOpen = true
