<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة المجازفة — NoL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-gradient: linear-gradient(135deg, #0a0d1c 0%, #171b36 50%, #0d0f1a 100%);
    --panel: #13172c;
    --line: #2e3559;
    --gold: #f3ce6b;
    --text:#f1f0ec;
    --text-dim:#9a9db3;
    --red:#d32f2f; --green:#2e7d32; --blue:#1565c0; --yellow:#f9a825; --purple:#6a1b9a;
  }
  *{box-sizing:border-box;user-select:none;}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 10px;
  }

  .wrap{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;}

  /* الهيدر والعنوان المطابق مع شعار NoL */
  .header-brand {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(19, 23, 44, 0.85);
    padding: 10px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .brand-title-group {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand-title {
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(to bottom, #fff, #b0c4de);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 2px 10px rgba(255,255,255,0.2);
  }
  /* شعار NoL المميز */
  .nol-logo {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #f3ce6b, #ff9f43);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    border: 1px solid rgba(243, 206, 107, 0.3);
    padding: 1px 6px;
    border-radius: 6px;
    background-color: rgba(243, 206, 107, 0.05);
  }
  .brand-site { font-size: 11px; color: var(--text-dim); text-align: left; }
  .brand-site span { color: var(--gold); display: block; font-weight: 700; }

  /* شريط التنقل والتحكم السريع */
  .top-toolbar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 0 4px; }
  .top-toolbar a, .top-toolbar button { background: none; border: none; color: var(--gold); font-family: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
  .top-toolbar a:hover, .top-toolbar button:hover { text-decoration: underline; }

  /* شريط الفرق الأفقي */
  .teams-container {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .team-card {
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 6px 10px;
    text-align: center;
    min-width: 90px;
    flex: 1;
    cursor: pointer;
    transition: all .2s;
  }
  .team-card.active {
    border-color: #4cd137;
    background: rgba(76, 209, 55, 0.1);
    box-shadow: 0 0 10px rgba(76, 209, 55, 0.3);
  }
  .team-card .t-name { font-size: 11px; color: var(--text-dim); font-weight: 700; }
  .team-card .t-score { font-size: 16px; font-weight: 900; color: #fff; }

  /* لوحة البطاقات الكلاسيكية */
  .game-frame {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    background: rgba(13, 15, 26, 0.6);
    padding: 10px;
    border-radius: 16px;
    border: 2px solid var(--line);
  }

  .card-cell {
    background: #191f3a;
    border: 2px solid #3d4a7a;
    border-radius: 10px;
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    color: #e2e8f0;
    cursor: pointer;
    position: relative;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.6), 0 4px 6px rgba(0,0,0,0.3);
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  
  .card-cell::after {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px dotted rgba(243, 206, 107, 0.35);
    border-radius: 7px;
    pointer-events: none;
  }

  .card-cell:hover {
    transform: scale(1.05);
    border-color: var(--gold);
  }

  .card-cell.used { pointer-events: none; }
  .bg-red { background: var(--red) !important; border-color: #ff6b6b !important; color: #fff !important; }
  .bg-green { background: var(--green) !important; border-color: #6ab04c !important; color: #fff !important; }
  .bg-blue { background: var(--blue) !important; border-color: #48dbfb !important; color: #fff !important; }
  .bg-yellow { background: var(--yellow) !important; border-color: #feca57 !important; color: #111 !important; }
  .bg-purple { background: var(--purple) !important; border-color: #c56cf0 !important; color: #fff !important; }

  /* لوحة المؤقت والتحكم بالأسفل */
  .footer-control {
    display: flex;
    gap: 10px;
    margin-top: 5px;
  }
  .action-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
    text-align: center;
  }
  .btn-save { background: #2e7d32; color: #fff; box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4); }
  .btn-fail { background: #c62828; color: #fff; box-shadow: 0 4px 15px rgba(198, 40, 40, 0.4); }

  /* النوافذ المنبثقة */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal-box { background: var(--panel); border: 2px solid var(--gold); border-radius: 16px; padding: 20px; width: 100%; max-width: 340px; text-align: center; }
  .modal-box h3 { color: var(--gold); margin-top: 0; }
  .modal-box button { background: var(--gold); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; color: #111; width: 100%; }
</style>
</head>
<body>

<div class="wrap">
  <!-- هيدر العنوان وشعار NoL -->
  <div class="header-brand">
    <div class="brand-title-group">
      <div class="brand-title">المجازفة</div>
      <div class="nol-logo">NoL</div>
    </div>
    <div class="brand-site">منصة الألعاب<span>flashi.me</span></div>
  </div>

  <!-- شريط الأدوار والتالي وتحديث الأسماء -->
  <div class="top-toolbar">
    <button onclick="openNamesModal()">✏️ تحديث الأسماء</button>
    <span style="color:var(--text-dim);" id="topTurnInfo">الدور: <strong style="color:var(--gold)">الفريق الأول</strong></span>
    <button onclick="resetGame()">🔄 إعادة اللعبة</button>
  </div>

  <!-- شريط الفرق الأفقية -->
  <div class="teams-container" id="teamsBar"></div>

  <!-- شبكة البطاقات الكلاسيكية -->
  <div class="game-frame" id="gameBoard"></div>

  <!-- أزرار حفظ الرصيد وتصفير المؤقت السفلي -->
  <div class="footer-control">
    <button class="action-btn btn-fail" onclick="failRound()">❌ تصفير المؤقت (خسارة)</button>
    <button class="action-btn btn-save" onclick="bankScore()">💾 حفظ الرصيد (<span id="tempScoreDisplay">0</span>)</button>
  </div>
</div>

<!-- نافذة تعديل الأسماء -->
<div class="modal-overlay" id="namesModal">
  <div class="modal-box">
    <h3>إدارة الفرق</h3>
    <div id="teamsInputsList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:15px;text-align:right;"></div>
    <button onclick="saveTeamNames()">حفظ وتطبيق</button>
  </div>
</div>

<!-- نافذة الفائز -->
<div class="modal-overlay" id="winnerModal">
  <div class="modal-box">
    <div style="font-size:36px;margin-bottom:5px;">🏆</div>
    <h3 id="winnerText"></h3>
    <button onclick="resetGame()">لعبة جديدة</button>
  </div>
</div>

<script>
let teams = [
  { name: 'الفريق الأول', score: 8 },
  { name: 'الفريق الثاني', score: 0 },
  { name: 'الفريق الثالث', score: 0 }
];

let activeTeamIndex = 0;
let tempScore = 0;
let roundColors = [];
let roundValues = [];
let totalCards = 35;
let boardCards = [];

const availableColors = [
  { name: 'red', cls: 'bg-red' },
  { name: 'green', cls: 'bg-green' },
  { name: 'blue', cls: 'bg-blue' },
  { name: 'yellow', cls: 'bg-yellow' },
  { name: 'purple', cls: 'bg-purple' }
];

function initGame() {
  let pool = [];
  for(let i=1; i<=totalCards; i++) {
    let col = availableColors[Math.floor(Math.random() * availableColors.length)];
    let val = (i % 9) + 1;
    pool.push({
      gridNum: i,
      color: col.name,
      cls: col.cls,
      value: val,
      text: val
    });
  }
  boardCards = pool;
  renderTeams();
  renderBoard();
  updateTempDisplay();
}

function renderTeams() {
  const container = document.getElementById('teamsBar');
  container.innerHTML = '';
  teams.forEach((team, index) => {
    const card = document.createElement('div');
    card.className = `team-card ${index === activeTeamIndex ? 'active' : ''}`;
    card.onclick = () => { activeTeamIndex = index; renderTeams(); };
    card.innerHTML = `
      <div class="t-name">${team.name}</div>
      <div class="t-score">${team.score}</div>
    `;
    container.appendChild(card);
  });
  document.getElementById('topTurnInfo').innerHTML = `الدور: <strong style="color:var(--gold)">${teams[activeTeamIndex].name}</strong>`;
}

function renderBoard() {
  const board = document.getElementById('gameBoard');
  board.innerHTML = '';
  
  boardCards.forEach((item, idx) => {
    const cell = document.createElement('div');
    cell.className = 'card-cell';
    cell.textContent = item.gridNum;
    cell.onclick = () => revealCard(cell, item);
    board.appendChild(cell);
  });
}

function revealCard(cell, item) {
  if (cell.classList.contains('used')) return;

  if (roundColors.includes(item.color) || roundValues.includes(item.value)) {
    cell.classList.add('used', item.cls);
    cell.textContent = item.text;
    alert('❌ تكرار اللون أو الرقم! خسر الفريق الرصيد المؤقت.');
    failRound();
    return;
  }

  roundColors.push(item.color);
  roundValues.push(item.value);
  tempScore += item.value;

  cell.classList.add('used', item.cls);
  cell.textContent = item.text;
  updateTempDisplay();
}

function updateTempDisplay() {
  document.getElementById('tempScoreDisplay').textContent = tempScore;
}

function bankScore() {
  if (tempScore <= 0) return;
  teams[activeTeamIndex].score += tempScore;
  resetRound();
  nextTurn();
}

function failRound() {
  resetRound();
  nextTurn();
}

function resetRound() {
  tempScore = 0;
  roundColors = [];
  roundValues = [];
  updateTempDisplay();
}

function nextTurn() {
  activeTeamIndex = (activeTeamIndex + 1) % teams.length;
  renderTeams();
}

function resetGame() {
  document.getElementById('winnerModal').classList.remove('active');
  resetRound();
  activeTeamIndex = 0;
  teams.forEach(t => t.score = 0);
  initGame();
}

function openNamesModal() {
  const list = document.getElementById('teamsInputsList');
  list.innerHTML = '';
  teams.forEach((t, i) => {
    list.innerHTML += `<div>الاسم ${i+1}: <input type="text" id="teamInput_${i}" value="${t.name}" style="width:100%;padding:6px;border-radius:6px;background:#0d0f1a;color:#fff;border:1px solid var(--line);"></div>`;
  });
  document.getElementById('namesModal').classList.add('active');
}

function saveTeamNames() {
  teams.forEach((t, i) => {
    const val = document.getElementById(`teamInput_${i}`).value;
    if(val) t.name = val;
  });
  document.getElementById('namesModal').classList.remove('active');
  renderTeams();
}

initGame();
</script>
</body>
</html>
