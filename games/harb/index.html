<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة الحرب — NoL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f1a; --bg-soft:#141827; --panel:#191d2e; --line:rgba(255,255,255,.08);
    --text:#f1f0ec; --text-dim:#9a9db3; --accent:#ffb545; --accent-2:#6ee7c8;
    --red:#ff6b6b; --blue:#5ab8ff;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;min-height:100%;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 14px 50px;}
  h1{font-size:22px;font-weight:900;text-align:center;margin:6px 0 2px;}
  .sub{text-align:center;color:var(--text-dim);font-size:12.5px;margin:0 0 18px;}

  .teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .team{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:center;cursor:pointer;transition:border-color .15s;}
  .team.active{border-color:var(--accent-2);}
  .team.red.active{border-color:var(--red);}
  .team.blue.active{border-color:var(--blue);}
  .team input{
    width:100%;background:transparent;border:none;color:var(--text);font-family:inherit;
    font-weight:700;font-size:14px;text-align:center;margin-bottom:4px;
  }
  .team input:focus{outline:none;}
  .team .score{font-size:26px;font-weight:900;}
  .team.red .score{color:var(--red);}
  .team.blue .score{color:var(--blue);}
  .team .turn-tag{font-size:10.5px;color:var(--accent-2);margin-top:4px;height:14px;}

  .toolbar{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
  .btn{
    background:transparent;border:1.5px solid var(--line);color:var(--text-dim);
    font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:100px;cursor:pointer;
  }
  .btn:hover{color:var(--text);border-color:var(--accent);}
  .btn.exit:hover{border-color:var(--red);color:var(--red);}

  .board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .category h2{font-size:12.5px;color:var(--text-dim);text-align:center;margin:0 0 6px;font-weight:700;}
  .cells{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  
  .cell{
    aspect-ratio:1;border:1px solid var(--line);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;
    transition:transform .1s;
  }
  .cells .cell:nth-child(odd) {
    background-color: rgba(40, 167, 69, 0.25);
    border-color: rgba(40, 167, 69, 0.4);
  }
  .cells .cell:nth-child(even) {
    background-color: rgba(220, 53, 69, 0.25);
    border-color: rgba(220, 53, 69, 0.4);
  }

  .cell:hover{transform:translateY(-2px);border-color:var(--accent);}
  .cell.used{opacity:.15;pointer-events:none;filter:grayscale(1);background:var(--panel) !important;}

  .overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);
    align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .overlay.active{display:flex;}
  .reveal{
    background:var(--panel);border:1px solid var(--line);border-radius:20px;
    padding:26px 22px;max-width:320px;width:100%;text-align:center;
  }
  .reveal .icon{font-size:56px;margin-bottom:6px;}
  .reveal .name{font-size:19px;font-weight:900;margin-bottom:4px;}
  .reveal .effect{font-size:15px;font-weight:700;margin-bottom:18px;min-height:22px;}
  .reveal .effect.gain{color:var(--accent-2);}
  .reveal .effect.loss{color:var(--red);}
  .reveal .effect.neutral{color:var(--text-dim);}
  .reveal button{
    width:100%;background:var(--accent);border:none;color:#1a1200;font-family:inherit;
    font-weight:800;font-size:15px;border-radius:12px;padding:12px;cursor:pointer;
  }

  .winner{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
    align-items:center;justify-content:center;padding:20px;z-index:60;text-align:center;
  }
  .winner.active{display:flex;}
  .winner .box{background:var(--panel);border:1px solid var(--accent);border-radius:20px;padding:30px 24px;max-width:320px;width:100%;}
  .winner .box .trophy{font-size:52px;}
  .winner .box h2{font-size:22px;margin:8px 0 20px;}
  .winner .box button{
    width:100%;background:var(--accent);border:none;color:#1a1200;font-family:inherit;
    font-weight:800;font-size:15px;border-radius:12px;padding:12px;cursor:pointer;
  }

  /* نافذة تأكيد الخروج */
  .exit-modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
    align-items:center;justify-content:center;padding:20px;z-index:70;text-align:center;
  }
  .exit-modal.active{display:flex;}
  .exit-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 22px;max-width:320px;width:100%;}
  .exit-box h3{font-size:18px;margin:0 0 16px;}
  .exit-actions{display:flex;gap:10px;}
  .exit-actions button{flex:1;padding:10px;border-radius:10px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;border:none;}
  .btn-confirm-exit{background:var(--red);color:#fff;}
  .btn-cancel-exit{background:transparent;border:1.5px solid var(--line)!important;color:var(--text-dim);}
  .btn-cancel-exit:hover{color:var(--text);border-color:var(--accent)!important;}

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f6f5f1;--bg-soft:#fff;--panel:#fff;--line:rgba(0,0,0,.1);--text:#16161a;--text-dim:#68697a;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚔️ لعبة الحرب</h1>
  <p class="sub">اختر فريقاً نشطاً، ثم اضغطوا على مربع لكشف السلاح</p>

  <div class="teams">
    <div class="team red active" id="teamA" onclick="setActive('A')">
      <input id="nameA" value="الفريق الأحمر" maxlength="16" onclick="event.stopPropagation()">
      <div class="score" id="scoreA" onclick="editScore(event,'A')">200</div>
      <div class="turn-tag">🔴 دوره الآن</div>
    </div>
    <div class="team blue" id="teamB" onclick="setActive('B')">
      <input id="nameB" value="الفريق الأزرق" maxlength="16" onclick="event.stopPropagation()">
      <div class="score" id="scoreB" onclick="editScore(event,'B')">200</div>
      <div class="turn-tag"></div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" onclick="toggleAuto()" id="autoBtn">🔁 تبديل تلقائي: مُفعّل</button>
    <button class="btn" onclick="resetGame()">🔄 لعبة جديدة</button>
    <button class="btn exit" onclick="confirmExit()">🚪 خروج</button>
  </div>

  <div class="board">
    <div class="category">
      <h2>رموز</h2>
      <div class="cells" id="colSymbol"></div>
    </div>
    <div class="category">
      <h2>أرقام</h2>
      <div class="cells" id="colNumber"></div>
    </div>
    <div class="category">
      <h2>حيوانات</h2>
      <div class="cells" id="colAnimal"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="reveal">
    <div class="icon" id="revIcon">💣</div>
    <div class="name" id="revName">قنبلة</div>
    <div class="effect" id="revEffect"></div>
    <button onclick="closeReveal()">متابعة</button>
  </div>
</div>

<div class="winner" id="winnerBox">
  <div class="box">
    <div class="trophy">🏆</div>
    <h2 id="winnerText"></h2>
    <button onclick="resetGame()">لعبة جديدة</button>
  </div>
</div>

<!-- نافذة تأكيد الخروج -->
<div class="exit-modal" id="exitModal">
  <div class="exit-box">
    <h3>هل أنت متأكد من رغبتك في خروج من اللعبة؟</h3>
    <div class="exit-actions">
      <button class="btn-confirm-exit" onclick="exitGame()">نعم، خروج</button>
      <button class="btn-cancel-exit" onclick="closeExitModal()">إلغاء</button>
    </div>
  </div>
</div>

<script>
const symbolIcons = ['⚽','⛵','✂️','✉️','✋','✏️','❤️','🎁','⭐','✈️','🚩','👁️','🔔','💾','🔧','📞','🔍','🔑','🏠','🎈'];
const animalIcons = ['🦋','🐰','🐦','🐕','🐌','🐘','🦒','🐄','🦌','🕷️','🦆','🐴','🐫','🦏','🐊','🦇','🐓','🦚','🐐','🐻'];
const numberIcons = Array.from({length:20}, (_,i)=> String(i+1));

const weapons = [
  {icon:'💣', name:'قنبلة'},
  {icon:'⚔️', name:'سيف'},
  {icon:'🏹', name:'سهم'},
  {icon:'🚀', name:'صاروخ'},
  {icon:'🔫', name:'مسدس'},
  {icon:'🪃', name:'بوميرانغ'},
  {icon:'⚡', name:'صاعقة'},
  {icon:'🧨', name:'ديناميت'},
  {icon:'🗡️', name:'خنجر'},
  {icon:'🛡️', name:'درع', shield:true},
  {icon:'🏰', name:'حصن', shield:true},
  {icon:'🎯', name:'هدف'},
];
const points = [10,15,20,25,30,40,50];

let state = { active:'A', scores:{A:200,B:200}, auto:true, over:false };

function buildColumn(containerId, icons){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  icons.forEach((icon, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.textContent = icon;
    cell.addEventListener('click', () => pick(cell));
    el.appendChild(cell);
  });
}
buildColumn('colSymbol', symbolIcons);
buildColumn('colNumber', numberIcons);
buildColumn('colAnimal', animalIcons);

function setActive(team){
  if (state.over) return;
  state.active = team;
  renderTeams();
}

function renderTeams(){
  document.getElementById('teamA').classList.toggle('active', state.active === 'A');
  document.getElementById('teamB').classList.toggle('active', state.active === 'B');
  document.getElementById('scoreA').textContent = state.scores.A;
  document.getElementById('scoreB').textContent = state.scores.B;
  document.querySelectorAll('.turn-tag').forEach(t => t.textContent = '');
  const tag = state.active === 'A' ? '🔴 دوره الآن' : '🔵 دوره الآن';
  document.getElementById(state.active === 'A' ? 'teamA' : 'teamB').querySelector('.turn-tag').textContent = tag;
}

function editScore(e, team){
  e.stopPropagation();
  const val = prompt('عدّل نقاط الفريق:', state.scores[team]);
  if (val === null) return;
  const n = parseInt(val, 10);
  if (!isNaN(n)) { state.scores[team] = n; renderTeams(); }
}

function toggleAuto(){
  state.auto = !state.auto;
  document.getElementById('autoBtn').textContent = '🔁 تبديل تلقائي: ' + (state.auto ? 'مُفعّل' : 'موقّف');
}

function pick(cell){
  if (state.over || cell.classList.contains('used')) return;
  cell.classList.add('used');

  const w = weapons[Math.floor(Math.random() * weapons.length)];
  const val = points[Math.floor(Math.random() * points.length)];
  const picker = state.active;
  const opponent = picker === 'A' ? 'B' : 'A';

  const revIcon = document.getElementById('revIcon');
  const revName = document.getElementById('revName');
  const revEffect = document.getElementById('revEffect');
  revIcon.textContent = w.icon;
  revName.textContent = w.name;

  if (w.shield){
    revEffect.textContent = 'دفاع — لا تغيير في النقاط';
    revEffect.className = 'effect neutral';
  } else if (Math.random() < 0.65){
    state.scores[opponent] = Math.max(0, state.scores[opponent] - val);
    revEffect.textContent = `-${val} من ${teamName(opponent)}`;
    revEffect.className = 'effect gain';
  } else {
    state.scores[picker] = Math.max(0, state.scores[picker] - val);
    revEffect.textContent = `ارتد! -${val} من ${teamName(picker)}`;
    revEffect.className = 'effect loss';
  }

  renderTeams();
  document.getElementById('overlay').classList.add('active');

  if (state.auto) state.active = opponent;
}

function teamName(t){
  return document.getElementById(t === 'A' ? 'nameA' : 'nameB').value || (t === 'A' ? 'الفريق الأحمر' : 'الفريق الأزرق');
}

function closeReveal(){
  document.getElementById('overlay').classList.remove('active');
  checkWinner();
  renderTeams();
}

function checkWinner(){
  if (state.scores.A <= 0 || state.scores.B <= 0){
    state.over = true;
    const loser = state.scores.A <= 0 ? 'A' : 'B';
    const winner = loser === 'A' ? 'B' : 'A';
    document.getElementById('winnerText').textContent = `فاز ${teamName(winner)}! 🎉`;
    document.getElementById('winnerBox').classList.add('active');
  }
}

function resetGame(){
  state = { active:'A', scores:{A:200,B:200}, auto:state.auto, over:false };
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('used'));
  document.getElementById('winnerBox').classList.remove('active');
  renderTeams();
}

/* دوال زر الخروج */
function confirmExit(){
  document.getElementById('exitModal').classList.add('active');
}

function closeExitModal(){
  document.getElementById('exitModal').classList.remove('active');
}

function exitGame(){
  // محاولة إغلاق النافذة أو توجيه المستخدم لصفحة أخرى أو عرض رسالة وداع
  window.close();
  // إذا لم يتم إغلاق النافذة (بسبب قيود المتصفحات الحديثة)، سيتم إظهار شاشة رسالة وداع أو إعادة توجيه
  document.body.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0d0f1a;color:#f1f0ec;font-family:'Tajawal',sans-serif;text-align:center;padding:20px;">
      <div>
        <h2 style="font-size:24px;margin-bottom:10px;">👋 شكراً لتركونا نلعب معاً!</h2>
        <p style="color:#9a9db3;font-size:14px;">تم إنهاء اللعبة. يمكنك إغلاق هذه النافذة بأمان الآن.</p>
      </div>
    </div>
  `;
}

renderTeams();
</script>
</body>
</html>
