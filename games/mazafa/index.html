<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة المجازفة — NoL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0f19;
    --panel: #131826;
    --line: #222c45;
    --gold: #f3ce6b;
    --text:#f1f0ec;
    --text-dim:#8b92af;
    --red:#e53935; --green:#2e7d32; --blue:#1e88e5; --yellow:#fbc02d; --purple:#8e24aa;
  }
  *{box-sizing:border-box;user-select:none;}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--bg);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 12px;
  }

  .wrap{max-width:440px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;}

  /* الهيدر النظيف الفاخر بدون أي إضافات مزعجة */
  .header-brand {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    padding: 12px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .brand-title-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-title {
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .nol-logo {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;
    color: var(--gold);
    border: 1px solid rgba(243, 206, 107, 0.4);
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(243, 206, 107, 0.08);
  }
  
  .top-actions {
    display: flex;
    gap: 8px;
  }
  .top-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 6px 10px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .top-btn:hover { color: #fff; border-color: var(--gold); }

  /* شريط الفرق الأفقي */
  .teams-container {
    display: flex;
    gap: 8px;
  }
  .team-card {
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 8px;
    text-align: center;
    flex: 1;
    cursor: pointer;
    transition: all 0.2s;
  }
  .team-card.active {
    border-color: #4cd137;
    background: rgba(76, 209, 55, 0.08);
    box-shadow: 0 0 12px rgba(76, 209, 55, 0.2);
  }
  .team-card .t-name { font-size: 11px; color: var(--text-dim); font-weight: 700; margin-bottom: 2px; }
  .team-card .t-score { font-size: 18px; font-weight: 900; color: #fff; }

  /* معلومات الدور الحالي بشكل أنيق */
  .turn-banner {
    background: rgba(243, 206, 107, 0.05);
    border: 1px dashed rgba(243, 206, 107, 0.3);
    padding: 8px;
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
  }
  .turn-banner strong { color: var(--gold); }

  /* لوحة البطاقات الكلاسيكية والمرتبة */
  .game-frame {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    background: var(--panel);
    padding: 12px;
    border-radius: 16px;
    border: 1px solid var(--line);
  }

  .card-cell {
    background: #182033;
    border: 2px solid #2b3758;
    border-radius: 10px;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    color: #e2e8f0;
    cursor: pointer;
    position: relative;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    transition: all 0.15s ease;
  }
  
  .card-cell:hover {
    transform: translateY(-2px);
    border-color: var(--gold);
  }

  /* ألوان البطاقات المفتوحة */
  .card-cell.used { pointer-events: none; }
  .bg-red { background: var(--red) !important; border-color: #ff6b6b !important; color: #fff !important; }
  .bg-green { background: var(--green) !important; border-color: #6ab04c !important; color: #fff !important; }
  .bg-blue { background: var(--blue) !important; border-color: #48dbfb !important; color: #fff !important; }
  .bg-yellow { background: var(--yellow) !important; border-color: #feca57 !important; color: #111 !important; }
  .bg-purple { background: var(--purple) !important; border-color: #c56cf0 !important; color: #fff !important; }

  /* أزرار التحكم السفلية */
  .footer-control {
    display: flex;
    gap: 10px;
  }
  .action-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
    text-align: center;
  }
  .btn-save { background: #2e7d32; color: #fff; box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3); }
  .btn-fail { background: #c62828; color: #fff; box-shadow: 0 4px 15px rgba(198, 40, 40, 0.3); }

  /* النوافذ المنبثقة */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal-box { background: var(--panel); border: 2px solid var(--gold); border-radius: 16px; padding: 20px; width: 100%; max-width: 340px; text-align: center; }
  .modal-box h3 { color: var(--gold); margin-top: 0; }
  .modal-box button { background: var(--gold); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; color: #111; width: 100%; }
</style>
</head>
<body>

<div class="wrap">
  <!-- الهيدر النظيف بدون فلاشي -->
  <div class="header-brand">
    <div class="brand-title-group">
      <div class="brand-title">المجازفة</div>
      <div class="nol-logo">NoL</div>
    </div>
    <div class="top-actions">
      <button class="top-btn" onclick="openNamesModal()">✏️ الأسماء</button>
      <button class="top-btn" onclick="resetGame()">🔄 إعادة</button>
    </div>
  </div>

  <!-- شريط الفرق الأفقية -->
  <div class="teams-container" id="teamsBar"></div>

  <!-- بيان الدور الحالي -->
  <div class="turn-banner" id="turnBanner">
    دور الفريق: <strong id="activeTeamName">الفريق الأول</strong>
  </div>

  <!-- شبكة البطاقات الكلاسيكية المرتبة -->
  <div class="game-frame" id="gameBoard"></div>

  <!-- أزرار حفظ الرصيد وتصفير المؤقت -->
  <div class="footer-control">
    <button class="action-btn btn-fail" onclick="failRound()">❌ تصفير الرصيد (خسارة)</button>
    <button class="action-btn btn-save" onclick="bankScore()">💾 حفظ الرصيد (<span id="tempScoreDisplay">0</span>)</button>
  </div>
</div>

<!-- نافذة تعديل الأسماء -->
<div class="modal-overlay" id="namesModal">
  <div class="modal-box">
    <h3>تحديث أسماء الفرق</h3>
    <div id="teamsInputsList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:15px;text-align:right;"></div>
    <button onclick="saveTeamNames()">حفظ وتطبيق</button>
  </div>
</div>

<script>
let teams = [
  { name: 'الفريق الأول', score: 0 },
  { name: 'الفريق الثاني', score: 0 },
  { name: 'الفريق الثالث', score: 0 }
];

let activeTeamIndex = 0;
let tempScore = 0;
let currentRoundPicks = []; // لتتبع البطاقات المفتوحة في المحاولة الحالية فقط لإرجاعها لو حدث تكرار
let totalCards = 30; // 30 بطاقة مرتبة ونظيفة
let boardCards = [];

const availableColors = [
  { name: 'red', cls: 'bg-red' },
  { name: 'green', cls: 'bg-green' },
  { name: 'blue', cls: 'bg-blue' },
  { name: 'yellow', cls: 'bg-yellow' },
  { name: 'purple', cls: 'bg-purple' }
];

function initGame() {
  let pool = [];
  for(let i=1; i<=totalCards; i++) {
    let col = availableColors[Math.floor(Math.random() * availableColors.length)];
    let val = (i % 8) + 1; // قيم من 1 إلى 8
    pool.push({
      id: i,
      gridNum: i,
      color: col.name,
      cls: col.cls,
      value: val,
      isOpen: false,
      permanentlyUsed: false // إذا تم حفظها بنجاح تختفي أو تقفل نهائياً
    });
  }
  boardCards = pool;
  tempScore = 0;
  currentRoundPicks = [];
  renderTeams();
  renderBoard();
  updateTempDisplay();
}

function renderTeams() {
  const container = document.getElementById('teamsBar');
  container.innerHTML = '';
  teams.forEach((team, index) => {
    const card = document.createElement('div');
    card.className = `team-card ${index === activeTeamIndex ? 'active' : ''}`;
    card.onclick = () => { 
      // عند تغيير الفريق يدوياً يتم تصفير محاولة الفريق السابق المحتملة
      if(currentRoundPicks.length > 0) failRound(false);
      activeTeamIndex = index; 
      renderTeams(); 
    };
    card.innerHTML = `
      <div class="t-name">${team.name}</div>
      <div class="t-score">${team.score}</div>
    `;
    container.appendChild(card);
  });
  document.getElementById('activeTeamName').textContent = teams[activeTeamIndex].name;
}

function renderBoard() {
  const board = document.getElementById('gameBoard');
  board.innerHTML = '';
  
  boardCards.forEach((item, idx) => {
    const cell = document.createElement('div');
    cell.className = 'card-cell';
    
    if (item.permanentlyUsed) {
      cell.classList.add('used');
      cell.style.opacity = '0.15';
      cell.style.pointerEvents = 'none';
      cell.textContent = '';
    } else if (item.isOpen) {
      cell.className = `card-cell used ${item.cls}`;
      cell.textContent = item.value;
    } else {
      cell.textContent = item.gridNum;
    }

    cell.onclick = () => revealCard(item);
    board.appendChild(cell);
  });
}

function revealCard(item) {
  if (item.isOpen || item.permanentlyUsed) return;

  // التحقق من التكرار في نفس دور الفريق الحالي (سواء اللون أو الرقم)
  let isDuplicate = currentRoundPicks.some(p => p.color === item.color || p.value === item.value);

  if (isDuplicate) {
    // فتح البطاقة مؤقتاً لتوضيح سبب الخسارة ثم إخفاؤها وإرجاع كل شيء
    item.isOpen = true;
    renderBoard();
    
    setTimeout(() => {
      alert('❌ حصل تكرار (في اللون أو الرقم)! خسر الفريق الرصيد المؤقت وعادت البطاقات مغلقة.');
      failRound(true);
    }, 200);
    return;
  }

  // إذا لم يحدث تكرار، تفتح البطاقة ويُضاف الرصيد المؤقت
  item.isOpen = true;
  currentRoundPicks.push(item);
  tempScore += item.value;
  
  renderBoard();
  updateTempDisplay();
}

function updateTempDisplay() {
  document.getElementById('tempScoreDisplay').textContent = tempScore;
}

function bankScore() {
  if (tempScore <= 0) return;
  teams[activeTeamIndex].score += tempScore;
  
  // تثبيت البطاقات التي فتحها هذا الفريق نهائياً حتى لا تختار مرة أخرى
  currentRoundPicks.forEach(p => p.permanentlyUsed = true);
  
  resetRoundState();
  nextTurn();
}

function failRound(switchTurn = true) {
  // إعادة البطاقات التي فتحها الفريق في هذه المحاولة إلى حالتها الأصلية المغلقة (تختفي الأرقام والألوان)
  currentRoundPicks.forEach(p => p.isOpen = false);
  resetRoundState();
  if (switchTurn) {
    nextTurn();
  }
}

function resetRoundState() {
  tempScore = 0;
  currentRoundPicks = [];
  updateTempDisplay();
  renderBoard();
}

function nextTurn() {
  activeTeamIndex = (activeTeamIndex + 1) % teams.length;
  renderTeams();
}

function resetGame() {
  activeTeamIndex = 0;
  teams.forEach(t => t.score = 0);
  initGame();
}

function openNamesModal() {
  const list = document.getElementById('teamsInputsList');
  list.innerHTML = '';
  teams.forEach((t, i) => {
    list.innerHTML += `<div>الاسم ${i+1}: <input type="text" id="teamInput_${i}" value="${t.name}" style="width:100%;padding:8px;border-radius:8px;background:#0b0f19;color:#fff;border:1px solid var(--line);"></div>`;
  });
  document.getElementById('namesModal').classList.add('active');
}

function saveTeamNames() {
  teams.forEach((t, i) => {
    const val = document.getElementById(`teamInput_${i}`).value;
    if(val) t.name = val;
  });
  document.getElementById('namesModal').classList.remove('active');
  renderTeams();
}

initGame();
</script>
</body>
</html>
