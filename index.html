<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<!-- ========================================================================
  Firebase Realtime Database
  استبدل القيم أدناه ببيانات مشروعك من Firebase Console:
  Project settings → General → Your apps → SDK setup and configuration
========================================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#0d0f1a;
    --bg-soft:#141827;
    --panel:#191d2e;
    --line: rgba(255,255,255,0.08);
    --text:#f1f0ec;
    --text-dim:#9a9db3;
    --accent:#ffb545;
    --accent-2:#6ee7c8;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- top bar ---------- */
  header{
    width:100%;
    max-width:520px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:28px 20px 10px;
  }
  .logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:1px;
    color:var(--text);
  }
  .logo span{color:var(--accent);}

  .support-btn{
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--text-dim);
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    padding:9px 16px;
    border-radius:100px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:border-color .15s ease, color .15s ease;
  }
  .support-btn:hover, .support-btn:focus-visible{
    border-color:var(--accent);
    color:var(--text);
  }
  .support-btn svg{width:16px;height:16px;flex:none;}

  main{
    width:100%;
    max-width:520px;
    flex:1;
    padding:24px 20px 40px;
  }

  /* ---------- home view: game grid ---------- */
  .tagline{
    color:var(--text-dim);
    font-size:15px;
    margin:0 0 26px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .slot{
    aspect-ratio:1/1;
    border:1.5px dashed var(--line);
    border-radius:18px;
    background:var(--panel);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:var(--text-dim);
    text-align:center;
    padding:12px;
  }
  .slot.filled{
    border-style:solid;
    border-color:var(--line);
    cursor:pointer;
    color:var(--text);
    transition:transform .12s ease, border-color .12s ease;
  }
  .slot.filled:hover, .slot.filled:focus-visible{
    transform:translateY(-3px);
    border-color:var(--accent);
  }
  .slot .plus{
    font-size:26px;
    line-height:1;
    color:var(--line);
  }
  .slot .name{
    font-size:15px;
    font-weight:700;
  }
  .slot .hint{
    font-size:12px;
    color:var(--text-dim);
  }
  .slot .lock{
    position:absolute;
    top:10px;
    inset-inline-end:10px;
    width:18px;height:18px;
    color:var(--accent);
  }
  .slot{position:relative;}

  /* ---------- code modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-overlay.active{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    width:100%;
    max-width:360px;
  }
  .modal h2{
    font-size:18px;
    margin:0 0 4px;
  }
  .modal p{
    font-size:13px;
    color:var(--text-dim);
    margin:0 0 16px;
  }
  .modal input{
    width:100%;
    background:var(--bg-soft);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    direction:ltr;
    text-align:center;
    letter-spacing:2px;
  }
  .modal input:focus{outline:none;border-color:var(--accent-2);}
  .modal-msg{
    font-size:13px;
    min-height:18px;
    margin:10px 0 0;
  }
  .modal-msg.error{color:#ff8080;}
  .modal-msg.ok{color:var(--accent-2);}
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .modal-actions button{
    flex:1;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    border-radius:10px;
    padding:11px;
    cursor:pointer;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--text-dim);
  }
  .modal-actions .confirm{
    background:var(--accent);
    border-color:var(--accent);
    color:#1a1200;
  }
  .modal-actions button:disabled{opacity:.5;cursor:default;}

  /* ---------- support view ---------- */
  .back-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    padding:0 0 22px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .back-btn:hover{color:var(--text);}
  .support-title{
    font-size:22px;
    font-weight:900;
    margin:0 0 6px;
  }
  .support-sub{
    color:var(--text-dim);
    font-size:14px;
    margin:0 0 24px;
  }
  .socials{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .social-link{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    border-radius:14px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    text-decoration:none;
    font-weight:500;
    transition:border-color .15s ease;
  }
  .social-link:hover, .social-link:focus-visible{border-color:var(--accent-2);}
  .social-link .icon{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-soft);
    flex:none;
  }
  .social-link .icon svg{width:18px;height:18px;}
  .social-link .label{font-size:15px;}
  .social-link .handle{
    margin-inline-start:auto;
    color:var(--text-dim);
    font-size:13px;
    direction:ltr;
  }

  .view{display:none;}
  .view.active{display:block;}

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f6f5f1; --bg-soft:#ffffff; --panel:#ffffff;
      --line:rgba(0,0,0,0.1); --text:#16161a; --text-dim:#68697a;
    }
  }
</style>
</head>
<body>

<header>
  <div class="logo">No<span>L</span></div>
  <button class="support-btn" id="supportBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16v-4M12 8h.01"/><circle cx="12" cy="12" r="9"/></svg>
    الدعم
  </button>
</header>

<main>

  <!-- ===== الواجهة الأولى: الألعاب ===== -->
  <section class="view active" id="homeView">
    <p class="tagline">اختر لعبة وابدأ اللعب مع أصحابك</p>
    <div class="grid" id="gamesGrid">
      <!-- تُملأ هذه المربعات لاحقاً من Firebase Realtime Database
           أو يدوياً بإضافة عناصر .slot.filled هنا -->
      <div class="slot"><span class="plus">+</span></div>
      <div class="slot"><span class="plus">+</span></div>
      <div class="slot"><span class="plus">+</span></div>
      <div class="slot"><span class="plus">+</span></div>
    </div>
  </section>

  <!-- ===== الواجهة الثانية: الدعم ===== -->
  <section class="view" id="supportView">
    <button class="back-btn" id="backBtn" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      رجوع
    </button>
    <h1 class="support-title">تواصل معنا</h1>
    <p class="support-sub">تابعونا وشاركوا آراءكم عبر هذه الحسابات</p>
    <div class="socials" id="socialsList">
      <!-- تُملأ هذه القائمة من Firebase أيضاً إن رغبت، أو تُترك ثابتة كما هنا -->
    </div>
  </section>

</main>

<!-- ===== نافذة إدخال كود الاشتراك ===== -->
<div class="modal-overlay" id="codeOverlay">
  <div class="modal">
    <h2 id="codeModalTitle">أدخل كود الاشتراك</h2>
    <p id="codeModalSub">هذه اللعبة تتطلب كوداً فعّالاً. لطلب كود تواصل مع الدعم.</p>
    <input type="text" id="codeInput" placeholder="XXXX-XXXX" maxlength="20" autocomplete="off">
    <p class="modal-msg" id="codeMsg"></p>
    <div class="modal-actions">
      <button type="button" id="codeCancel">إلغاء</button>
      <button type="button" class="confirm" id="codeConfirm">تفعيل</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   1) إعداد Firebase — عدّل القيم بمعلومات مشروعك
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDiOGYHADTeRz4CrrMh264K0sOQNrINl4w",
  authDomain: "nool-1fa3a.firebaseapp.com",
  databaseURL: "https://nool-1fa3a-default-rtdb.firebaseio.com",
  projectId: "nool-1fa3a",
  storageBucket: "nool-1fa3a.firebasestorage.app",
  messagingSenderId: "552551048252",
  appId: "1:552551048252:web:c99ba47af88cb131078f39",
  measurementId: "G-ZCMH5FFTL6"
};
let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
} catch (e) {
  console.warn("Firebase غير مهيأ بعد — عدّل firebaseConfig بأعلى الملف.", e);
}

/* ============================================================
   2) التنقل بين الواجهتين
============================================================ */
const homeView = document.getElementById('homeView');
const supportView = document.getElementById('supportView');
const supportBtn = document.getElementById('supportBtn');
const backBtn = document.getElementById('backBtn');

supportBtn.addEventListener('click', () => {
  homeView.classList.remove('active');
  supportView.classList.add('active');
});
backBtn.addEventListener('click', () => {
  supportView.classList.remove('active');
  homeView.classList.add('active');
});

/* ============================================================
   3) شبكة الألعاب — تُقرأ من Realtime Database
   شكل البيانات المتوقّع تحت المسار "games" (المفتاح = معرّف اللعبة):
   {
     "games": {
       "spy": {
         "name": "الجاسوس",
         "hint": "لعبة جماعية",
         "url": "https://...",
         "requiresCode": true   // false أو محذوفة = لعبة مجانية بلا كود
       }
     }
   }

   الاشتراكات: عند تفعيل اللعبة، نطلب كوداً ونتحقق منه تحت "codes/{code}":
   {
     "codes": {
       "AB12-CD34": {
         "gameId": "spy",
         "days": 30,            // مدة الاشتراك بالأيام (7 أسبوع / 30 شهر / 365 سنة)
         "status": "new",       // "new" لم يُستخدم بعد → "active" بعد أول تفعيل
         "deviceId": null,      // يُربط تلقائياً بأول جهاز يفعّله
         "expiresAt": null      // يُحسب تلقائياً عند أول تفعيل
       }
     }
   }
   تُنشئ أنت (الدعم) عنصر الكود يدوياً في Firebase Console بعد الدفع،
   وتحدد "days" و"gameId" فقط — الباقي يُملأ تلقائياً من الموقع.
============================================================ */
const gamesGrid = document.getElementById('gamesGrid');
let currentGames = {};

function renderGames(gamesObj){
  currentGames = gamesObj || {};
  const entries = Object.entries(currentGames);
  if (!entries.length) return; // نُبقي المربعات الفارغة كما هي

  gamesGrid.innerHTML = '';
  const total = Math.max(4, entries.length);
  for (let i = 0; i < total; i++){
    const pair = entries[i];
    const id = pair ? pair[0] : null;
    const g = pair ? pair[1] : null;
    const slot = document.createElement('div');
    slot.className = 'slot' + (g ? ' filled' : '');
    if (g){
      const lockIcon = g.requiresCode
        ? '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>'
        : '';
      slot.innerHTML = `${lockIcon}<span class="name">${g.name}</span><span class="hint">${g.hint || ''}</span>`;
      slot.tabIndex = 0;
      slot.addEventListener('click', () => openGame(id, g));
      slot.addEventListener('keydown', e => { if (e.key === 'Enter') openGame(id, g); });
    } else {
      slot.innerHTML = `<span class="plus">+</span>`;
    }
    gamesGrid.appendChild(slot);
  }
}

if (db){
  db.ref('games').on('value', snap => renderGames(snap.val()));
}

/* ============================================================
   3.1) معرّف الجهاز — لربط الكود بالجهاز الذي فعّله
============================================================ */
function getDeviceId(){
  let id = localStorage.getItem('nol_device_id');
  if (!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : 'dev-' + Date.now() + '-' + Math.random().toString(16).slice(2));
    localStorage.setItem('nol_device_id', id);
  }
  return id;
}

/* ============================================================
   3.2) فتح اللعبة — تتحقق من الحاجة لكود ومن صلاحية أي كود محفوظ محلياً
============================================================ */
const codeOverlay = document.getElementById('codeOverlay');
const codeInput = document.getElementById('codeInput');
const codeMsg = document.getElementById('codeMsg');
const codeConfirm = document.getElementById('codeConfirm');
const codeCancel = document.getElementById('codeCancel');
let activeGameId = null;
let activeGameUrl = null;

function unlockKey(gameId){ return 'nol_unlock_' + gameId; }

function openGame(gameId, g){
  if (!g.requiresCode){
    window.location.href = g.url || '#';
    return;
  }
  const saved = JSON.parse(localStorage.getItem(unlockKey(gameId)) || 'null');
  if (saved && saved.expiresAt > Date.now()){
    window.location.href = g.url || '#';
    return;
  }
  activeGameId = gameId;
  activeGameUrl = g.url || '#';
  codeInput.value = '';
  codeMsg.textContent = '';
  codeMsg.className = 'modal-msg';
  codeOverlay.classList.add('active');
  setTimeout(() => codeInput.focus(), 50);
}

codeCancel.addEventListener('click', () => codeOverlay.classList.remove('active'));
codeOverlay.addEventListener('click', e => { if (e.target === codeOverlay) codeOverlay.classList.remove('active'); });

codeConfirm.addEventListener('click', async () => {
  const code = codeInput.value.trim().toUpperCase();
  if (!code){ showMsg('أدخل الكود أولاً', 'error'); return; }
  if (!db){ showMsg('لم يتم إعداد Firebase بعد', 'error'); return; }

  codeConfirm.disabled = true;
  showMsg('جارٍ التحقق...', '');

  const ref = db.ref('codes/' + code);
  const deviceId = getDeviceId();

  try {
    const result = await ref.transaction(current => {
      if (current === null) return current; // الكود غير موجود
      if (current.status === 'revoked') return current; // كود ملغى، لا تفعيل
      // كود مستخدم من قبل: نسمح فقط لنفس الجهاز الذي فُعّل عليه
      if (current.status === 'active'){
        if (current.deviceId !== deviceId) return; // إلغاء المعاملة → يبقى كما هو
        return current; // نفس الجهاز، لا تغيير
      }
      // أول تفعيل: نربط الكود بهذا الجهاز ونحسب تاريخ الانتهاء
      const days = Number(current.days) || 30;
      current.status = 'active';
      current.deviceId = deviceId;
      current.activatedAt = Date.now();
      current.expiresAt = Date.now() + days * 24 * 60 * 60 * 1000;
      return current;
    });

    codeConfirm.disabled = false;

    if (!result.committed || result.snapshot.val() === null){
      showMsg('الكود غير صحيح', 'error');
      return;
    }
    const data = result.snapshot.val();

    if (data.status === 'revoked'){
      showMsg('تم إلغاء هذا الكود، تواصل مع الدعم', 'error');
      return;
    }
    if (data.deviceId !== deviceId){
      showMsg('هذا الكود مُستخدم على جهاز آخر', 'error');
      return;
    }
    if (data.gameId !== activeGameId){
      showMsg('هذا الكود غير صالح لهذه اللعبة', 'error');
      return;
    }
    if (data.expiresAt < Date.now()){
      showMsg('انتهت صلاحية هذا الكود', 'error');
      return;
    }

    localStorage.setItem(unlockKey(activeGameId), JSON.stringify({ expiresAt: data.expiresAt }));
    showMsg('تم التفعيل ✓', 'ok');
    setTimeout(() => {
      codeOverlay.classList.remove('active');
      window.location.href = activeGameUrl;
    }, 500);

  } catch (e){
    codeConfirm.disabled = false;
    showMsg('حدث خطأ، حاول مرة أخرى', 'error');
    console.error(e);
  }
});

function showMsg(text, kind){
  codeMsg.textContent = text;
  codeMsg.className = 'modal-msg' + (kind ? ' ' + kind : '');
}

/* ============================================================
   4) حسابات التواصل — ثابتة هنا، أو استبدلها بقراءة من "social" في DB
============================================================ */
const defaultSocials = [
  { label:'X (تويتر)', handle:'@NoL', url:'https://x.com/', icon:'x' },
  { label:'انستغرام',   handle:'@NoL', url:'https://instagram.com/', icon:'instagram' },
  { label:'ديسكورد',    handle:'discord.gg/noole_', url:'https://discord.gg/6s2hryWHV/', icon:'discord' },
  { label:'تيك توك',    handle:'@uu.s22', url:'https://www.tiktok.com/@uu.s22?_r=1&_t=ZS-99yJCW5a2ki/', icon:'tiktok' },
];

const icons = {
  x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.3 3H21l-6.6 7.5L22 21h-6.3l-4.9-6.4L4.9 21H2.2l7-8L2 3h6.4l4.4 5.9L18.3 3Zm-1.1 16.2h1.6L7 4.7H5.3l11.9 14.5Z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>',
  discord: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 5.5a17 17 0 0 0-4.2-1.3l-.3.6a15 15 0 0 1 3.6 1.4A16.5 16.5 0 0 0 4.9 6.2a15 15 0 0 1 3.7-1.4l-.3-.6A17 17 0 0 0 4 5.5C1.7 9 1 12.4 1.3 15.7a17 17 0 0 0 5 2.6l.7-1.1a11 11 0 0 1-1.7-.8l.4-.3a12.7 12.7 0 0 0 10.6 0l.4.3c-.5.3-1.1.6-1.7.8l.7 1.1a17 17 0 0 0 5-2.6C23 12.4 22.3 9 20 5.5ZM9 14c-.8 0-1.5-.8-1.5-1.7S8.1 10.5 9 10.5s1.5.8 1.5 1.8S9.9 14 9 14Zm6 0c-.8 0-1.5-.8-1.5-1.7s.7-1.8 1.5-1.8 1.5.8 1.5 1.8-.7 1.7-1.5 1.7Z"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 3c.4 2 1.8 3.6 4 4v3a7 7 0 0 1-4-1.3V15a6 6 0 1 1-6-6c.3 0 .7 0 1 .1v3.1a3 3 0 1 0 2 2.8V3h3Z"/></svg>',
};

function renderSocials(list){
  const wrap = document.getElementById('socialsList');
  wrap.innerHTML = '';
  list.forEach(s => {
    const a = document.createElement('a');
    a.className = 'social-link';
    a.href = s.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = `<span class="icon">${icons[s.icon] || ''}</span>
                   <span class="label">${s.label}</span>
                   <span class="handle">${s.handle}</span>`;
    wrap.appendChild(a);
  });
}

renderSocials(defaultSocials);

if (db){
  db.ref('social').once('value').then(snap => {
    const val = snap.val();
    if (val) renderSocials(Object.values(val));
  }).catch(()=>{});
}
</script>
</body>
</html>
